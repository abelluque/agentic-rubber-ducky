# Apply on the SPOKE cluster GitOps (not the MaaS hub).
# destination.server in-cluster = the spoke API.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: granite-code-demo
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai-granite-code-demo
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/abelluque/agentic-rubber-ducky.git
    targetRevision: main
    path: gitops/overlays/spoke
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-granite
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
