apiVersion: v1
kind: Service
metadata:
  name: llamastack-postgres
spec:
  selector:
    app: llamastack-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamastack-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llamastack-postgres
  template:
    metadata:
      labels:
        app: llamastack-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          env:
            - name: POSTGRESQL_USER
              value: llamastack
            - name: POSTGRESQL_DATABASE
              value: llamastack
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-postgres
                  key: password
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          emptyDir: {}
