apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
data:
  librechat.yaml: |
    version: 1.2.1
    cache: true
    endpoints:
      custom:
        - name: "Granite DevOps Agent (MaaS)"
          apiKey: "not-used"
          baseURL: "http://orchestrator.demo-granite.svc.cluster.local:8080/v1"
          models:
            default:
              - "granite-3-1-2b-instruct"
            fetch: false
          titleConvo: false
          maxContextTokens: 3072
          dropParams:
            - user
            - frequency_penalty
            - presence_penalty
            - stop
          addParams:
            max_tokens: 1024
          modelDisplayLabel: "DevOps Agent (IBM Granite MaaS)"
        - name: "Granite Chat (Llama Stack)"
          apiKey: "not-used"
          baseURL: "http://llamastack.demo-granite.svc.cluster.local:8321/v1"
          models:
            default:
              - "vllm-inference/granite-3-1-2b-instruct"
            fetch: false
          titleConvo: false
          maxContextTokens: 3072
          dropParams:
            - user
            - frequency_penalty
            - presence_penalty
            - stop
          addParams:
            max_tokens: 1024
          modelDisplayLabel: "Granite Chat (MaaS via Llama Stack)"
