[project]
name = "granite-mcp"
version = "0.1.0"
description = "MCP/REST tools for the RHOAI Granite DevOps demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "mcp>=1.2.0",
  "kubernetes>=31.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
