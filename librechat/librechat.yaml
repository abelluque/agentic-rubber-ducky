version: 1.2.1
cache: true
endpoints:
  custom:
    - name: "Granite DevOps Agent (MaaS)"
      apiKey: "${LLAMASTACK_API_KEY:-not-used}"
      baseURL: "http://orchestrator.demo-granite.svc.cluster.local:8080/v1"
      models:
        default:
          - "ibm-granite/granite-3.0-8b-instruct"
          - "granite-3-0-8b-instruct"
        fetch: true
      titleConvo: true
      modelDisplayLabel: "DevOps Agent (IBM Granite MaaS)"
    - name: "Granite Chat (Llama Stack)"
      apiKey: "${LLAMASTACK_API_KEY:-not-used}"
      baseURL: "http://llamastack.demo-granite.svc.cluster.local:8321/v1/openai/v1"
      models:
        default:
          - "granite-3-0-8b-instruct"
        fetch: false
      titleConvo: true
      modelDisplayLabel: "Granite Chat (MaaS via Llama Stack)"
