version: 1.2.1
cache: true
endpoints:
  custom:
    - name: "Granite DevOps Agent (MaaS)"
      apiKey: "${LLAMASTACK_API_KEY:-not-used}"
      baseURL: "http://orchestrator.demo-granite.svc.cluster.local:8080/v1"
      models:
        default:
          - "ibm-granite/granite-3.0-8b-instruct"
          - "granite-3-0-8b-instruct"
        fetch: false
      titleConvo: false
      maxContextTokens: 768
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - stop
      addParams:
        max_tokens: 256
      modelDisplayLabel: "DevOps Agent (IBM Granite MaaS)"
    - name: "Granite Chat (Llama Stack)"
      apiKey: "${LLAMASTACK_API_KEY:-not-used}"
      baseURL: "http://llamastack.demo-granite.svc.cluster.local:8321/v1"
      models:
        default:
          - "vllm-inference/granite-3-1-2b-instruct"
        fetch: false
      titleConvo: false
      maxContextTokens: 768
      dropParams:
        - user
        - frequency_penalty
        - presence_penalty
        - stop
      addParams:
        max_tokens: 256
      modelDisplayLabel: "Granite Chat (MaaS via Llama Stack)"
