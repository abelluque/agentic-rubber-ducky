apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-demo-crds
  namespace: llama-stack-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wait-demo-crds
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wait-demo-crds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wait-demo-crds
subjects:
  - kind: ServiceAccount
    name: wait-demo-crds
    namespace: llama-stack-system
