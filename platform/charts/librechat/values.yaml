replicaCount: 1

image:
  repository: ghcr.io/danny-avila/librechat
  tag: v0.7.8
  pullPolicy: IfNotPresent

service:
  port: 3080

route:
  enabled: true
  host: ""

existingSecret: demo-librechat

orchestrator:
  url: http://orchestrator.demo-granite.svc.cluster.local:8080/v1

llamastack:
  url: http://llamastack.demo-granite.svc.cluster.local:8321/v1/openai/v1

model: granite-3-0-8b-instruct

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
