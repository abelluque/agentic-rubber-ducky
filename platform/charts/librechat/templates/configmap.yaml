apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "librechat.fullname" . }}-config
  labels:
    {{- include "librechat.labels" . | nindent 4 }}
data:
  librechat.yaml: |
    version: 1.2.1
    cache: true
    endpoints:
      custom:
        - name: "Granite DevOps Agent (MaaS)"
          apiKey: "not-used"
          baseURL: {{ .Values.orchestrator.url | quote }}
          models:
            default:
              - {{ .Values.model | quote }}
            fetch: true
          titleConvo: true
          modelDisplayLabel: "DevOps Agent (IBM Granite MaaS)"
        - name: "Granite Chat (Llama Stack)"
          apiKey: "not-used"
          baseURL: {{ .Values.llamastack.url | quote }}
          models:
            default:
              - {{ .Values.model | quote }}
            fetch: false
          titleConvo: true
          modelDisplayLabel: "Granite Chat (MaaS via Llama Stack)"
