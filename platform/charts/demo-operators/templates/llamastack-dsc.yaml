{{- if .Values.llamastack.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enable-llamastack
  namespace: {{ .Values.dsc.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-enable-llamastack
rules:
  - apiGroups: ["datasciencecluster.opendatahub.io"]
    resources: ["datascienceclusters"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-enable-llamastack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-enable-llamastack
subjects:
  - kind: ServiceAccount
    name: enable-llamastack
    namespace: {{ .Values.dsc.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-enable-llamastack
  namespace: {{ .Values.dsc.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "0"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: enable-llamastack
      restartPolicy: OnFailure
      containers:
        - name: patch
          image: {{ .Values.dsc.toolsImage }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              oc patch datasciencecluster {{ .Values.dsc.name }} --type=merge -p \
                '{"spec":{"components":{"llamastackoperator":{"managementState":"Managed"}}}}'
{{- end }}
